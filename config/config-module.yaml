# =========================
# Loop pipeline config only
# (ArmoRM scoring -> refine -> vLLM gen -> loop -> final outputs)
# =========================

# loop / threshold
seed: 42
gamma: 0.13
threshold: min     # one of: min | mean | max
max_loop: 3

# io
inference_path: ./results/inference-ultrafeedback50-error.jsonl
feedback_path: ./results/ultra5-module/min

# OpenAI refine
# gpt_model: gpt-4o
# gpt_max_tokens: 1024
# gpt_worker_count: 16   # ThreadPoolExecutor workers for OpenAI calls

# evaluator/refiner vLLM
eval_model_id: /data2/seohyeong/query-refinement/models/feedback
eval_tp: 1
eval_dtype: bfloat16
eval_max_input_length: 4096

eval_temperature: 0.7
eval_top_p: 1.0
eval_max_tokens: 4096

refine_model_id: /data2/seohyeong/query-refinement/models/refiner
refine_tp: 1
refine_dtype: bfloat16
refine_max_input_length: 4096

refine_temperature: 0.7
refine_top_p: 1.0
refine_max_tokens: 4096

# vLLM generation
model_id: princeton-nlp/Llama-3-Base-8B-SFT   # or your local path
tp: 1                                        # tensor_parallel_size
max_input_length: 4096                       # vLLM max_model_len
max_new_tokens: 512
temperature: 0.7
top_p: 1.0