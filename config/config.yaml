# =========================
# 1. Inference Initinal score 
# 2. Refinement Loop 
#   - ArmoRM scoring -> refine -> vLLM gen
# 3. final outputs
# =========================

data_path: openbmb/ultrafeedback
exp_num: 1

# loop / threshold
seed: 42
split: 0.5 # for sampling
tau: 0.05 # 
threshold: min     # one of: min | mean | max
max_loop: 3

# io
output_path: ./results/sampling-path.jsonl
instruction_path: ./results/instruction-path.jsonl
inference_path: ./results/inference-path.jsonl
feedback_path: ./results/feedback_path

# OpenAI refine  
gpt_model: gpt-4o
gpt_max_tokens: 1024
gpt_worker_count: 16   # ThreadPoolExecutor workers for OpenAI calls

# vLLM generation
model_id: princeton-nlp/Llama-3-Base-8B-SFT  # or your local path
tp: 1                                        # tensor_parallel_size
max_input_length: 4096                       # vLLM max_model_len
max_new_tokens: 512
temperature: 0.9
top_p: 1.0